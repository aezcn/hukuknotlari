name = "hukuk-notlari-push"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cloudflare panelinden KV namespace olustur ve id'yi buraya yapistir
# (veya: npx wrangler kv namespace create SUBS)
[[kv_namespaces]]
binding = "SUBS"
id = "BURAYA_KV_NAMESPACE_ID"

# Her 15 dakikada bir uyanir, saati gelen aboneliklere push atar
[triggers]
crons = ["*/15 * * * *"]

[vars]
VAPID_PUBLIC_KEY = "BURAYA_ACIK_ANAHTAR"
VAPID_SUBJECT = "mailto:seninmailin@ornek.com"
ALLOWED_ORIGIN = "https://KULLANICIADIN.github.io"

# GIZLI anahtar vars'a YAZILMAZ. Su komutla eklenir:
#   npx wrangler secret put VAPID_PRIVATE_JWK
# ya da panelden: Settings > Variables and Secrets > Add (type: Secret)
